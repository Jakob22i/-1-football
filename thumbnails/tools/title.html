<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Nosifer;src:url(node_modules/@fontsource/nosifer/files/nosifer-latin-400-normal.woff2)}
@font-face{font-family:Creepster;src:url(node_modules/@fontsource/creepster/files/creepster-latin-400-normal.woff2)}
@font-face{font-family:Butcherman;src:url(node_modules/@fontsource/butcherman/files/butcherman-latin-400-normal.woff2)}
@font-face{font-family:Eater;src:url(node_modules/@fontsource/eater/files/eater-latin-400-normal.woff2)}
@font-face{font-family:MetalMania;src:url(node_modules/@fontsource/metal-mania/files/metal-mania-latin-400-normal.woff2)}
html,body{margin:0;background:#000}
#s{position:relative;width:1920px;height:1080px;overflow:hidden}
#s img{position:absolute;inset:0;width:100%;height:100%}
#t{position:absolute;white-space:nowrap;line-height:1;color:#c40d12;
 text-shadow:0 0 .06em #000,0 .03em .02em #4a0004,0 0 .35em rgba(255,20,20,.55)}
</style></head><body><div id="s"><img id="i"><div id="t"></div></div>
<script>
const q=new URLSearchParams(location.search);const c=JSON.parse(q.get('c'));
document.getElementById('i').src=c.img;
const t=document.getElementById('t');t.textContent=c.text||'Admitted';
t.style.fontFamily=c.font;t.style.fontSize=c.size+'px';
for(const k of ['left','right','top','bottom'])if(c[k]!==undefined)t.style[k]=c[k]+'px';
if(c.rot)t.style.transform=`rotate(${c.rot}deg)`;if(c.ls)t.style.letterSpacing=c.ls;
if(c.color)t.style.color=c.color;
document.fonts.ready.then(()=>Promise.all(Object.values({a:document.fonts.load('10px '+c.font)}))).then(()=>{const im=document.getElementById('i');(im.complete?Promise.resolve():new Promise(r=>im.onload=r)).then(()=>window.__done=true)});
</script></body></html>
