<!doctype html><html><head><meta charset="utf-8"><style>

</style></head><body><div id="s"><img id="i"><div id="g"></div><canvas id="cv" width="1920" height="1080"></canvas></div>
<script>
const q=new URLSearchParams(location.search);const c=JSON.parse(q.get('c'));
